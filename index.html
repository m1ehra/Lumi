.btn.fb{background:#3b5998;box-shadow:none}

.btn.w{background:#fff;color:#1d1d2b;box-shadow:none}
.center{text-align:center}
.small{font-size:10.5px}
a.l,.l{color:var(--p);cursor:pointer}
.tabbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-around;background:#fff;box-shadow:0 -6px 20px rgba(30,30,60,.06);padding:0 6px;position:relative;z-index:5}
.tabbar button{width:44px;height:44px;display:grid;place-items:center;color:#9aa0ac}

.ava{border-radius:50%;object-fit:cover;display:block;flex:none}
.sheetwrap{position:absolute;inset:0;z-index:20}
.dim{position:absolute;inset:0;background:rgba(20,20,30,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:14px 22px 22px;animation:up .3s ease;max-height:92%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.lbl{font-weight:600;font-size:11.5px;margin:18px 0 4px}
.sw{width:42px;height:24px;border-radius:12px;background:#d8dbe3;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--p)}.sw.on::after{left:21px}
input[type=range]{accent-color:var(--p);width:100%}
.dual{position:relative;height:26px}
.dual .tr{position:absolute;left:0;right:0;top:11px;height:3px;border-radius:2px;background:#e3e6ed}
.dual .fl{position:absolute;top:11px;height:3px;background:var(--p)}
.dual input{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--p);box-shadow:0 2px 5px rgba(0,0,0,.2);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--p);cursor:pointer}

.row{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer}
.row .t{flex:1;min-width:0}

.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--p);color:#fff;font-size:9px;padding:0 4px;margin-top:3px}
.acc{height:20px;padding:0 12px;border-radius:10px;background:var(--p);color:#fff;font-size:9px}
.acc.done{background:#e9ebf0;color:#888}
.sec{font-size:11px;color:var(--mut);padding:14px 18px 4px}
.msgs{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:9px 13px;font-size:11px;line-height:1.4;border-radius:14px;animation:pop .2s}

.b.them{background:#eceef3;align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:var(--p);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ts{font-size:8px;color:var(--mut);margin:0 4px 6px}
.ts.me{align-self:flex-end}
.chatin{display:flex;gap:8px;align-items:center;padding:8px 12px 12px;background:#fff}
.chatin .ib2{width:30px;height:30px;border-radius:50%;background:#eceef3;display:grid;place-items:center;color:#888}
.chatin input{flex:1;height:38px;border-radius:19px;border:0;background:#f2f3f7;padding:0 14px;font-size:11px;outline:0}
.chatin .snd{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center}
.ul{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;height:34px;margin:0 0 6px;font-size:12px}
.ul:focus{box-shadow:none;border-color:var(--p)}
.ulb{font-size:9px;color:var(--mut);margin-top:12px}
.stats{display:flex;justify-content:center;gap:34px;margin:14px 0}
.stats div{text-align:center}.stats b{display:block;color:var(--p);font-size:13px}.stats span{font-size:9px;color:var(--mut)}
.tabs{display:flex;justify-content:center;gap:34px;border-bottom:1px solid var(--line);margin:0 22px}
.tabs button{padding:8px 4px;font-size:10px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--p)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
#card{position:absolute;inset:0;border-radius:6px;overflow:hidden;touch-action:none;cursor:grab;box-shadow:0 12px 30px rgba(30,30,60,.2);background:#ddd}
#card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#card .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:13px;font-weight:600;pointer-events:none}
#card .cap small{display:block;font-size:10px;font-weight:400}
.stamp{position:absolute;top:24px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:700;font-size:20px;opacity:0;pointer-events:none}
#stL{left:18px;color:#2ec97b;border-color:#2ec97b;transform:rotate(-14deg)}
#stN{right:18px;color:#ff4d5e;border-color:#ff4d5e;transform:rotate(14deg)}
.act{display:flex;justify-content:center;gap:26px;padding:14px 0}
.act button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 6px 16px rgba(30,30,60,.15);color:#ff4d5e}
.act button.h{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(var(--pr),.4)}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(25,25,35,.92);color:#fff;font-size:11px;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
#menu{position:absolute;inset:0;padding:calc(var(--sb) + 40px) 26px;color:#fff;background:linear-gradient(170deg,var(--p2),var(--pd))}
#menu .mi{display:flex;align-items:center;gap:14px;padding:12px 0;font-size:12px;font-weight:500;width:100%;text-align:left}
.empty{text-align:center;color:var(--mut);padding:50px 30px;font-size:12px}
.hero{position:relative;height:290px;flex:none}
.hero img{width:100%;height:100%;object-fit:cover}
.sheet2{margin-top:-24px;background:#fff;border-radius:24px 24px 0 0;position:relative;padding:18px 22px 24px}
.sheet2 h4{margin:14px 0 6px;font-size:11.5px;font-weight:600}
.sheet2 p{margin:0;font-size:10px;color:#777;line-height:1.55}
.heartfab{position:absolute;right:20px;top:-18px;width:38px;height:38px;border-radius:50%;background:#ffe3ea;color:var(--p);display:grid;place-items:center}
.heartfab.on{background:var(--p);color:#fff}
@media(max-width:480px){
 :root{--sb:env(safe-area-inset-top,0px)}
 #stage{padding:0}
 #phone{width:100vw;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
 .sb{display:none}
 .screen{padding-top:calc(var(--sb) + 4px)}
}

/* ---------- fixes: no shaking on mobile ---------- */
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#stage{overflow:hidden}
#host{overflow:hidden}
.screen{overflow:hidden;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(max-width:480px){
 #stage{position:fixed;inset:0;padding:0;display:block;min-height:0}
 #phone{position:fixed;left:0;top:0;width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
 input,.inp,.chatin input{font-size:16px!important}
}
/* ---------- language pills + RTL ---------- */
.lgs{position:absolute;top:calc(var(--sb) + 12px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3;direction:ltr}
.lg{padding:6px 14px;border-radius:16px;font-size:11px;font-weight:500;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55)}
.lg.on{background:#fff;color:var(--p);border-color:#fff}
body{font-family:Poppins,Vazirmatn,system-ui,sans-serif}
input[type=range],.dual{direction:ltr}
#menu .mi{text-align:start}
[dir=rtl] .fld .eye{right:auto;left:12px}
[dir=rtl] [data-back] svg{transform:scaleX(-1)}
[dir=rtl] .row .tm{text-align:left}
[dir=rtl] .b.them{border-radius:14px 14px 4px 14px}
[dir=rtl] .b.me{border-radius:14px 14px 14px 4px}
[dir=rtl] .heartfab{right:auto;left:20px}
[dir=rtl] .stats,[dir=rtl] .tabs{direction:rtl}

/* ---------- new discover / match / tabbar / language button ---------- */
.screen.soft{background:radial-gradient(circle at 85% 0,rgba(var(--pr),.18) 0,transparent 46%),radial-gradient(circle at 0 100%,rgba(var(--pr),.11) 0,transparent 52%),var(--soft)}
.dec{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dec i{position:absolute;border-radius:50%;background:rgba(var(--pr),.1)}
.hd2{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px;flex:none;position:relative;z-index:2}
.sq{width:40px;height:40px;border-radius:13px;background:#fff;box-shadow:0 6px 16px rgba(var(--pr),.14);display:grid;place-items:center;color:var(--p)}
.ttl{text-align:center;line-height:1.25}.ttl b{font-size:15px;font-weight:600;display:block}.ttl small{font-size:9px;color:var(--mut)}

.pc.behind{transform:scale(.94) translateY(14px);opacity:.92;animation:behin .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes behin{from{transform:scale(.82) translateY(30px);opacity:0}}
.ims{position:absolute;inset:0;overflow:hidden}
.ims img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ims img.inR{animation:inR .45s cubic-bezier(.2,.8,.2,1) both}
.ims img.inL{animation:inL .45s cubic-bezier(.2,.8,.2,1) both}
.ims img.outL{animation:outL .45s ease both}

@keyframes inR{from{transform:translateX(28%) scale(1.12);opacity:0}to{transform:none;opacity:1}}

@keyframes outR{to{transform:translateX(22%) scale(.94);opacity:0}}

.pc .cap2{position:absolute;inset-inline-start:18px;inset-inline-end:84px;bottom:38px;color:#fff;cursor:pointer}
.cap2 b{font-size:19px;font-weight:600;display:block;line-height:1.25}.cap2 span{font-size:11px;opacity:.92}
.acts{position:absolute;inset-inline-end:14px;bottom:30px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:3}

.acts button:active{transform:scale(.85)}
.acts .h{width:54px;height:54px;background:var(--p);box-shadow:0 10px 24px rgba(var(--pr),.55)}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px;pointer-events:none}

.pc .stamp{top:56px}
#stL{inset-inline-start:18px}#stN{inset-inline-end:18px}
/* tab bar */
.tabbar{height:64px;margin:0 16px 14px;border-radius:24px;box-shadow:0 12px 30px rgba(var(--pr),.14);padding:0 8px;z-index:6}

.duo{position:relative;width:290px;height:240px;direction:ltr;flex:none}

.ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.ph2.a{left:8px;top:34px;transform:rotate(-9deg);animation:fromL 1s cubic-bezier(.2,1.1,.3,1) both}

@keyframes fromL{from{transform:translateX(-260px) rotate(-40deg);opacity:0}to{transform:rotate(-9deg);opacity:1}}

.hb{position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;box-shadow:0 8px 18px rgba(var(--pr),.3);animation:pop2 .6s 1s cubic-bezier(.3,1.6,.5,1) both}
.hb.h1{left:0;top:26px}.hb.h2{right:0;bottom:12px}
.hb.hc{left:50%;top:50%;margin:-26px 0 0 -26px;width:52px;height:52px;background:var(--p);animation:pop2 .7s .8s cubic-bezier(.3,1.6,.5,1) both,beat 1.4s 1.6s ease-in-out infinite;z-index:3;border:3px solid #fff}
@keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}

.cg{font-size:10px;letter-spacing:3px;font-weight:600;color:var(--p);margin-top:18px;animation:up2 .6s 1.1s both}

.sws{display:flex;gap:12px;flex-wrap:wrap}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}

.cth:active{transform:scale(.95)}.cth img{width:100%;height:100%;object-fit:cover;display:block}.cth.on{border-color:var(--p)}
.lb{position:absolute;inset:0;z-index:45;direction:ltr;display:flex;align-items:center;justify-content:center;animation:fade .2s}

/* ================= dark mode ================= */
html.dark{--bg:#12121a;--sf:#1d1d29;--ink:#f2f2f7;--mut:#8f94a6;--line:#2b2b39;--inb:#363649;--fill:#272735;--soft:#12121a;--frame:#1d1d29;color-scheme:dark}

R.splash=()=>`<div class="screen wel" style="padding:0;justify-content:flex-end">
 <i class="wb b1"></i><i class="wb b2"></i>
 <div class="lgw"><button class="lgb" data-act="lgmenu">${ic('globe',15)}<span>${LANG.toUpperCase()}</span>${ic('chev',12)}</button><div class="lgm" id="lgm">${Object.keys(LANGS).map(k=>`<button class="${LANG===k?'on':''}" data-act="lang" data-arg="${k}">${LANGS[k]}${LANG===k?ic('check',13):''}</button>`).join('')}</div></div>
 <div class="wlogo"><div class="wm rise" style="--d:.55s"><img src="${LOGO_MARK}" alt=""></div><div class="ww rise" style="--d:.7s"><img src="${LOGO_WORD}" alt="LUMI"></div></div>
 <div class="pad" style="padding-bottom:46px;position:relative">
  <h1 class="wh rise" style="--d:.85s">Find your Perfect match Today</h1>
  <button class="btn rise" style="--d:.95s;margin-bottom:12px" data-go="login">Login</button>
  <button class="btn w rise" style="--d:1.05s" data-go="signup">Sign up</button>
  <button class="btn gst rise" style="--d:1.15s" data-act="guest">Continue as guest</button>
 </div></div>`;

R.login=()=>`<div class="screen">${bk('Login')}<div class="body pad">
 <div class="lgs rise">${logoImgs(54,40)}</div>
 <h1>Welcome Back</h1><div class="mut small" style="margin-bottom:26px">Sign in to continue</div>
 <input class="inp" id="em" placeholder="User Name or Email" autocomplete="username">
 <div class="fld"><input class="inp" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="eye" data-act="eye" data-arg="pw">${ic('eye',16)}</button></div>
 <div class="small mut" style="margin:-6px 0 18px;cursor:pointer" data-act="forgot">Forget Password?</div>
 <button class="btn" data-act="login">Log in</button>
 <div class="center mut small" style="margin:14px 0">or</div>
 ${SOC()}
 <button class="btn g" data-go="signup">Sign up with Email</button>
 <div class="center mut small" style="margin:50px 0 20px">Terms of use &amp; Privacy Policy</div>
</div></div>`;

R.signup=()=>`<div class="screen">${bk('Sign up')}<div class="body pad">
 <div class="lgs rise">${logoImgs(54,40)}</div>
 <h1>Create an account</h1><div class="mut small" style="margin-bottom:24px">Create account to continue</div>
 <input class="inp" id="un" placeholder="User Name">
 <input class="inp" id="em" placeholder="Email Address" type="email">
 <input class="inp" id="ph" placeholder="Phone number" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr">
 <div class="fld"><input class="inp" id="pw" type="password" placeholder="Password"><button class="eye" data-act="eye" data-arg="pw">${ic('eye',16)}</button></div>
 <div class="fld"><input class="inp" id="pw2" type="password" placeholder="Re enter Password"><button class="eye" data-act="eye" data-arg="pw2">${ic('eye',16)}</button></div>
 <button class="btn" style="margin-top:6px" data-act="signup">Sign Up</button>
 <div class="center mut small" style="margin:14px 0">or</div>
 ${SOC()}
 <div class="center mut small" style="margin:16px 0 40px">by Sign up you are agree with our<br><span class="l">terms &amp; condition of use</span></div>
 <div class="center small mut" style="margin-bottom:20px">Already have account? <span class="l" data-go="login">Log in</span></div>
</div></div>`;

function infoSections(d){let n=0;const D=()=>`--d:${(.05+(n++)*.06).toFixed(2)}s`;
 const sec=(ico,title,body)=>`<div class="isec rise" style="${D()}"><h4><span class="si">${ic(ico,13)}</span>${title}</h4>${body}</div>`;
 const chips=(a,ico)=>`<div class="chips">${a.map((x,i)=>`<span class="chip t cp" style="--d:${(.2+i*.035).toFixed(2)}s">${ico?ic(ico,11):''}<span>${esc(x)}</span></span>`).join('')}</div>`;
 const tile=(l,v)=>`<div class="tile"><span>${l}</span><b>${v}</b></div>`;
 let h='';
 if(d.bio&&d.bio.trim())h+=sec('smile','About me',`<p>${esc(d.bio)}</p>`);
 const T=[];if(d.age)T.push(tile('Age',d.age));if(d.height)T.push(tile('Height',`<span dir="ltr">${d.height} cm</span>`));if(d.weight)T.push(tile('Weight',`<span dir="ltr">${d.weight} kg</span>`));if(d.gender)T.push(tile('Gender',esc(d.gender)));if(d.edu)T.push(tile('Education',esc(d.edu)));if(d.job)T.push(tile('Job',esc(d.job)));if(d.city)T.push(tile('Location',esc(d.city)));
 if(T.length)h+=sec('user','Basic info',`<div class="tiles">${T.join('')}</div>`);
 if(d.goal)h+=sec('target','Goal of meeting',`<div class="goalc">${ic('heart',16,'#fff',0)}<span>${esc(d.goal)}</span></div>`);
 const lf=LIFE.filter(x=>d.life&&d.life[x.k]);
 if(lf.length)h+=sec('leaf','Lifestyle',`<div class="tiles">${lf.map(x=>tile(x.t,esc(d.life[x.k]))).join('')}</div>`);
 if(d.belief||d.relig||(d.values&&d.values.length)){let b='';if(d.belief||d.relig)b+=chips([d.belief,d.relig].filter(Boolean),'book');if(d.values&&d.values.length)b+=`<div class="sub">Values</div>`+chips(d.values,'star');h+=sec('book','Beliefs & values',b)}
 if(d.interests&&d.interests.length)h+=sec('heart','Interests',chips(d.interests));
 if(d.langs&&d.langs.length)h+=sec('globe','Languages',chips(d.langs,'globe'));
 if(d.insta&&d.instaShow)h+=sec('ig','Instagram',`<button class="igb" data-act="insta" data-arg="${esc(d.insta)}">${ic('ig',18)}<span>@${esc(d.insta)}</span><span class="ex">${ic('ext',14)}</span></button>`);
  return h}

  ${sec('about','smile','About me',`

function refreshProgress(){const P=completeness();const e=$('#epct');if(!e)return;
 e.textContent=P.pct+'%';$('#ebar').style.width=P.pct+'%';$('#erfg').style.strokeDashoffset=String(163.4*(1-P.pct/100));
 $('#etit').textContent=tr(P.pct>=MINP?'You are visible in Discover':'Reach 70% to appear in Discover');
 const h=$('#ehint');if(P.next){h.style.display='';h.dataset.arg=SECOF[P.next[0]];h.innerHTML=ic('plus',12,'none',2.6)+tr(P.next[3])}else{h.style.display='none'}
 const b=badges();Object.keys(b).forEach(k=>{const c=$('#cnt-'+k);if(c){c.textContent=b[k][0];c.classList.toggle('ok',!!b[k][1])}});
 const v=P.pct>=MINP;if(lastVis===false&&v)celebrate();lastVis=v}
function celebrate(){toast('You are now visible in Discover 🎉');buzz([50,40,50,40,90]);if(S.rm)return;
 const w=document.createElement('div');w.className='cfx';const cols=['#f5336a','#ff9f43','#2ec97b','#1e90ff','#7c5cff','#f0a500'];
 for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,r=90+Math.random()*190,p=document.createElement('i');p.className='cf';p.style.cssText=`background:${cols[i%6]};--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r+160).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg;animation-delay:${(Math.random()*.12).toFixed(2)}s`;w.appendChild(p)}
 $('#host').appendChild(w);setTimeout(()=>w.remove(),1900)}

function setWeight(v,fromRange){v=Math.max(35,Math.min(160,v));ME.weight=v;const h=$('#wval');h.textContent=v;h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump');if(!fromRange)$('#wrng').value=v;saveSoon()}
function setUid(raw){const v=raw.toLowerCase().replace(/[^a-z0-9._]/g,'').slice(0,20),h=$('#idh');const i=$('#uidf');if(i&&i.value!==v)i.value=v;
 if(!v){ME.uid='';if(h){h.className='idh';h.textContent=tr('Others can find you by this ID')}saveSoon();return}
 if(v.length<3){if(h){h.className='idh bad';h.textContent=tr('ID needs 3+ characters (a-z, 0-9, . _)')}return}
 if(USERS.some(u=>u.uid===v)){if(h){h.className='idh bad';h.textContent=tr('This ID is already taken')}return}
 ME.uid=v;if(h){h.className='idh ok';h.textContent=tr('ID saved')+' ✓ @'+v}saveSoon()}
function setHeight(v,fromRange){v=Math.max(140,Math.min(210,v));ME.height=v;const h=$('#hval');h.textContent=v;h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump');if(!fromRange)$('#hrng').value=v;saveSoon();refreshProgress()}
const OKF=new Set(['gender','edu','goal','belief','relig','langs','values','interests']);
const okF=f=>OKF.has(f)||(f.startsWith('life.')&&LIFE.some(x=>'life.'+x.k===f));
const getF=f=>f.startsWith('life.')?(ME.life[f.slice(5)]||''):(ME[f]||'');

I.editprofile=()=>{lastVis=completeness().pct>=MINP;
 const on=(id,ev,fn)=>{const e=$(id);e&&e.addEventListener(ev,fn)};

 on('#f5','change',e=>{const v=e.target.value;if(v&&(v>dobLim(18)||v<dobLim(100))){e.target.value=ME.dob;return toast('Age must be between 18 and 100')}if(v)ME.dob=v;$('#agechip').textContent=meAge();saveSoon()});
 on('#job','input',e=>{ME.job=e.target.value;saveSoon();refreshProgress()});
 on('#bio','input',e=>{ME.bio=e.target.value;$('#bcount').textContent=e.target.value.length+'/300';saveSoon();refreshProgress()});
 on('#ig','input',e=>{const raw=e.target.value.replace(/^@/,''),v=raw.replace(/[^A-Za-z0-9._]/g,'').slice(0,30);if(v!==raw)toast('Instagram username is invalid');e.target.value=v;ME.insta=v;saveSoon()});
 on('#hrng','input',e=>setHeight(+e.target.value,true));
 on('#wrng','input',e=>setWeight(+e.target.value,true));

 if(ESCROLL){const k=ESCROLL;ESCROLL=null;setTimeout(()=>{const el=document.querySelector('.acx[data-k="'+k+'"]');if(el)el.scrollIntoView({behavior:S.rm?'auto':'smooth',block:'start'})},420)}};

/* ---------- photo import ---------- */
function readImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
function refreshGrid(){const g=$('#pgrid');if(g){g.innerHTML=photoGrid();trDom(g)}}
function hereRefresh(){const t=stack[stack.length-1];if(!t)return;
 if(t.name==='editprofile'){const a=$('#eav');if(a)a.src=meAv();const cs=$('#cstrip');if(cs){cs.innerHTML=coverStrip();trDom(cs)}const ab=$('#avbt');if(ab){ab.innerHTML=avBtns();trDom(ab)}refreshGrid();refreshProgress()}
 else if(t.name==='profile')render(t.name,t.p)}
const okImg=f=>/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size<=15*1024*1024;
document.addEventListener('change',async e=>{const f=e.target;if(!f.classList||!f.classList.contains('fin'))return;const k=f.dataset.k,files=[...f.files];f.value='';if(!files.length)return;
 if(!files.every(okImg))return toast('Only JPG, PNG or WebP images up to 15 MB');
 try{if(k==='photos'){const add=[];for(const x of files){if(ME.photos.length+add.length>=maxPh()){toast('Maximum '+maxPh()+' photos');break}add.push(await readImg(x,900,.82))}ME.photos.push(...add);syncPh();if(add.length)toast(add.length>1?'Photos added':'Photo added')}
  else if(k==='cover'){ME.cover={t:'u',src:await readImg(files[0],1100,.8)};toast('Cover updated')}}catch(err){return toast('Could not read this image')}
 save();hereRefresh()});
$('#fi').addEventListener('change',async e=>{const f=e.target,k=f.dataset.k,files=[...f.files];f.value='';if(!files.length)return;
 if(!files.every(okImg))return toast('Only JPG, PNG or WebP images up to 15 MB');
 try{
  if(k==='cover'){ME.cover={t:'u',src:await readImg(files[0],1100,.8)};toast('Cover updated')}
  else{const add=[];for(const x of files){if(ME.photos.length+add.length>=maxPh()){toast('Maximum '+maxPh()+' photos');break}add.push(await readImg(x,900,.82))}ME.photos.push(...add);syncPh();if(add.length)toast(add.length>1?'Photos added':'Photo added')}
 }catch(err){return toast('Could not read this image')}
 save();hereRefresh()});

 c.onpointermove=e=>{if(!dr)return;dx=e.clientX-sx;const n=performance.now();if(n>lt){vx=(e.clientX-lx)/(n-lt);lx=e.clientX;lt=n}

 for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let[a,bb,c,d,e,f,g,h]=H;

function resetME(){Object.keys(ME).forEach(k=>delete ME[k]);Object.assign(ME,JSON.parse(ME0))}
function makeUsername(nm){let u=nm.toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,20);if(u.length<3)u='user'+String(Math.floor(Math.random()*90000)+10000);const used=new Set(allRecs().map(r=>r.username));let b=u,i=1;while(used.has(u)){u=b.slice(0,16)+(++i)}return u}
const pwOK=p=>typeof p==='string'&&p.length>=8&&p.length<=128&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const PWMSG='Password: 8+ characters with a letter and a number';
let pendingPay=null;

const lfGet=()=>PS.get('lumi.lf',{n:0,until:0});
const lfFail=()=>{const lf=lfGet();lf.n=(lf.n||0)+1;if(lf.n>=5)lf.until=Date.now()+Math.min(900000,30000*Math.pow(2,lf.n-5));PS.set('lumi.lf',lf)};
async function lumiSignup(){
 if(REM.on)return remSignup();
 const nm=clean($('#un').value,30),em=clean($('#em').value,80),ph=normPhone($('#ph').value),p=$('#pw').value.slice(0,128),p2=$('#pw2').value.slice(0,128);
 if(SITE.registrationOpen===false)return toast('Registration is closed right now');
 if(!nm||!em||!ph||!p||!p2)return toast('Please fill in all fields');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast('Enter a valid email');
 if(!/^\+?\d{8,15}$/.test(ph))return toast('Enter a valid phone number');
 if(!pwOK(p))return toast(PWMSG);if(p!==p2)return toast('Passwords do not match');
 if(allRecs().some(r=>(r.email||'').toLowerCase()===em.toLowerCase()||(r.phone&&r.phone===ph)))return toast('An account with this email or phone already exists');
 const salt=b64e(rndBytes(16)),hash=await hpw(p,salt,150000),id='u'+Array.from(rndBytes(8)).map(b=>(b%36).toString(36)).join(''),uname=makeUsername(nm);
 ME.user=nm;ME.name=nm;ME.email=em;ME.phone=ph;
 const rec={id,username:uname,name:nm,phone:ph,tg:'',email:em,age:meAge(),gender:genderCode(),city:ME.cityn||'',bio:ME.bio,interests:ME.interests.slice(0,8),status:'active',createdAt:Date.now(),trialUntil:Date.now()+TRIAL_D*DAY,lastLogin:Date.now(),loginCount:1,views:0,likesReceived:0,likesSent:0,matches:0,reports:0,premium:false,verified:false,note:'',starred:false,pw:{alg:'pbkdf2',it:150000,salt,hash,must:false},profile:JSON.parse(JSON.stringify(ME))};
 if(!putRec(rec))return toast('Storage is full — remove some photos');
 localStorage.setItem('lumi.cur',id);CURU=id;save();
 LP.log(id,'ثبت‌نام در سایت و ساخت پوشه‌ی /users/'+uname,'signup');LP.notif('کاربر جدید «'+nm+'» ثبت‌نام کرد؛ پوشه‌ی @'+uname+' ساخته شد','folderplus');
 $('#pw').value='';$('#pw2').value='';go('discover',{},{reset:true});afterAuth();toast('Account created 🎉')}
async function lumiLogin(){
 if(REM.on)return remLogin();
 const idf=clean($('#em').value,80).toLowerCase(),p=$('#pw').value.slice(0,128);
 if(!idf||!p)return toast('Enter your email and password');
 const lf=lfGet();if(lf.until>Date.now())return toast('Too many attempts. Try again in a moment');
 const ph=normPhone(idf);
 const rec=allRecs().find(r=>(r.email||'').toLowerCase()===idf||r.username===idf||(r.phone&&r.phone===ph));
 if(!rec||!rec.pw){lfFail();return toast('Wrong account or password')}
 const h=await hpw(p,rec.pw.salt,rec.pw.it);if(!ctEq(h,rec.pw.hash)){lfFail();return toast('Wrong account or password')}
 if(rec.status!=='active')return toast('This account is not active. Please contact support.');
 PS.set('lumi.lf',{n:0,until:0});
 if(CURU)save();resetME();applyMEsafe(rec.profile);CURU=rec.id;localStorage.setItem('lumi.cur',rec.id);
 rec.lastLogin=Date.now();rec.loginCount=(rec.loginCount||0)+1;putRec(rec);LP.log(rec.id,'ورود به حساب','login');
 $('#pw').value='';save();go('discover',{},{reset:true});afterAuth();toast('Welcome back, '+ME.name.split(' ')[0]+'!');if(rec.pw.must)setTimeout(forcePw,700)}
const applyMEsafe=m=>{if(m&&typeof m==='object')applyME(m)};
function afterAuth(){if(pendingPay&&SITE.plans.some(p=>p.id===pendingPay)){const id=pendingPay;pendingPay=null;setTimeout(()=>go('pay',{plan:id}),350)}else pendingPay=null}
function lumiLogout(){if(REM.on){remLogout();return}try{save()}catch(e){}try{localStorage.removeItem('lumi.cur')}catch(e){}CURU=null;resetME();save()}
function forcePw(){sheet(`<div class="grab"></div><b class="sh">Set a new password</b><p class="mut small" style="margin:0 0 12px">Your password was reset by support. Please choose a new one.</p><input class="inp" id="fp1" type="password" placeholder="New password" autocomplete="new-password" maxlength="128"><input class="inp" id="fp2" type="password" placeholder="Confirm new password" autocomplete="new-password" maxlength="128"><button class="btn" data-act="pwforce">Save</button>`)}
async function setNewPw(pw){if(REM.on)return remPw('',pw);const r=getRec(CURU);if(!r)return false;const salt=b64e(rndBytes(16)),hash=await hpw(pw,salt,150000);r.pw={alg:'pbkdf2',it:150000,salt,hash,must:false};LP.log(r.id,'رمز توسط کاربر تغییر کرد','info');return putRec(r)}
A.pwforce=async()=>{const a=$('#fp1').value,b=$('#fp2').value;if(!pwOK(a))return toast(PWMSG);if(a!==b)return toast('Passwords do not match');if(await setNewPw(a)){closeSheet();toast('Password updated')}};
async function lumiPwChange(){const a=$('#pw0').value,b=$('#pw1').value,c=$('#pw2n').value;if(!a)return toast('Enter your current password');if(!pwOK(b))return toast(PWMSG);if(b!==c)return toast('Passwords do not match');
 if(REM.on){if(!CURU){closeSheet();return toast('Sign in to change your password')}if(await remPw(a,b)){closeSheet();toast('Password updated')}return}
 const r=getRec(CURU);if(!r||!r.pw){closeSheet();return toast('Sign in to change your password')}
 const h=await hpw(a,r.pw.salt,r.pw.it);if(!ctEq(h,r.pw.hash))return toast('Current password is wrong');
 if(await setNewPw(b)){closeSheet();toast('Password updated')}}

const supMine=()=>REM.on?REM.sup:PS.get('lumi.p.support',[]).filter(m=>m&&typeof m==='object'&&m.userId===supUid());
const supTime=t=>new Date(t).toLocaleTimeString(LANG==='fa'?'fa-IR':undefined,{hour:'2-digit',minute:'2-digit'});
const supHTML=()=>{const l=supMine().sort((a,b)=>a.t-b.t);return l.length?l.map(m=>`<div class="spb ${m.from==='u'?'me':'ad'}">${esc(m.text)}<small>${m.from==='u'?'':tr('Support team')+' · '}${supTime(m.t)}</small></div>`).join(''):`<div class="mut small" style="text-align:center;padding:26px 8px">${tr('No messages yet')}</div>`};
R.support=()=>`<div class="screen">${bk('Help & support')}<div class="body spw" id="spw"><div class="spnote">${tr('Write to our team — we will reply here. You can also ask us to reset your password.')}</div><div id="spm" class="spm">${supHTML()}</div></div><div class="spin"><input id="spi" placeholder="Write a message…" maxlength="500" autocomplete="off"><button type="button" data-act="spsend">${ic('send',16)}</button></div></div>`;
I.support=()=>{const all=PS.get('lumi.p.support',[]);let ch=false;all.forEach(m=>{if(m&&m.userId===supUid()&&m.from==='a'&&!m.read){m.read=true;ch=true}});if(ch)PS.set('lumi.p.support',all);const b=$('#spw');b.scrollTop=b.scrollHeight;const i=$('#spi');i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();A.spsend()}})};
let lastSup=0;
A.spsend=()=>{const i=$('#spi');if(!i)return;const t=clean(i.value,500);if(!t)return;const nw=Date.now();if(nw-lastSup<500)return;lastSup=nw;if(supMine().length>=200)return toast('Too many messages');
 const nm=CURU?clean(ME.name,30):'مهمان';pushArr('lumi.p.support',{id:rid(),userId:supUid(),from:'u',text:t,t:Date.now(),read:false},1500);LP.notif('پیام جدید پشتیبانی از «'+nm+'»','message');i.value='';const m=$('#spm');m.innerHTML=supHTML();const b=$('#spw');b.scrollTop=b.scrollHeight};

 try{const j=await api('GET','/api/person?id='+encodeURIComponent(u.rid));const n=j&&j.user;if(n&&Array.isArray(n.photos)&&n.photos.length>u.photos.length){const x=mkRemUser(n);x.full=true;x.photos=n.photos.filter(p=>typeof p==='string'&&p.startsWith('data:image/'));remApply();const t=stack[stack.length-1];if(t&&t.name==='detail')rerenderHere()}}catch(e){}}

liked.delete=function(id){const had=this.has(id);const r=_likeDel(id);if(REM.on&&had&&CURU){const u=byId(id);if(u&&u.real){REMLK=REMLK.filter(x=>x!==u.rid);api('POST','/api/like/delete',{id:u.rid}).catch(()=>{})}}return r};

(()=>{const bt=$('#boot');$('#bmk').src=LOGO_MARK;$('#bwd').src=LOGO_WORD;
 const fmt=n=>LANG==='fa'?n.toLocaleString('fa-IR'):String(n);
 const total=S.rm?400:2900,t0=performance.now();let done=false;
 const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 (function tick(now){const k=Math.min(1,(now-t0)/total),v=Math.round(ease(k)*100);
  $('#bpct').textContent=fmt(v);$('#bfill').style.width=v+'%';
  if(k<1)return requestAnimationFrame(tick);
  if(done)return;done=true;
  Promise.resolve(window.REMP).catch(()=>{}).then(()=>{applySite();CURU?go('discover',{},{reset:true}):go('splash',{},{reset:true});if(CURU)afterAuth();if(REM.flash){const f=REM.flash;REM.flash=null;setTimeout(()=>toast(f),900)}});
  bt.classList.add('pre');
  setTimeout(()=>{bt.classList.add('out');setTimeout(()=>bt.remove(),S.rm?10:1100)},S.rm?0:420)})(t0);
})();
